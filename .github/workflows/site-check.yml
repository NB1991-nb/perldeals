name: Seiten-Check (Sicherheit)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          for u in http://perldeals.com/ http://www.perldeals.com/ https://www.perldeals.com/ https://perldeals.com/; do echo "== $u"; curl -sI -m 20 "$u" | grep -iE "^(HTTP|location|strict)"; done
          echo "== Zertifikat"; echo | openssl s_client -connect perldeals.com:443 -servername perldeals.com 2>/dev/null | openssl x509 -noout -issuer -subject -dates -ext subjectAltName
          echo "== www Zertifikat"; echo | openssl s_client -connect www.perldeals.com:443 -servername www.perldeals.com 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName
          echo "== Mixed content / externe Skripte"; curl -s https://perldeals.com/ | grep -oE '(src|href)="http://[^"]+' | head
          echo "== DNS"; dig +short perldeals.com A; dig +short perldeals.com MX; dig +short perldeals.com TXT; dig +short _dmarc.perldeals.com TXT; dig +short perldeals.com CAA

          echo "== Sucuri"; curl -s -m 40 "https://sitecheck.sucuri.net/api/v3/?scan=perldeals.com" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ['ratings','warnings','blacklists','recommendations','tls']},ensure_ascii=False)[:2500])"; echo
          echo "== URLhaus"; curl -s -m 20 -X POST https://urlhaus-api.abuse.ch/v1/host/ -d host=perldeals.com | head -c 300; echo
          echo "== RDAP"; curl -s -m 20 https://rdap.verisign.com/com/v1/domain/perldeals.com | python3 -c "import sys,json; d=json.load(sys.stdin); print([ (e['eventAction'],e['eventDate']) for e in d.get('events',[])])"
