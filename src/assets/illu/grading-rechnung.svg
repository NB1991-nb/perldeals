<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Beispielrechnung: Lohnt sich Grading nach allen Kosten?</title>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0E1C1B">Lohnt sich Grading?</text>
  <rect x="660" y="34" width="100" height="32" rx="16" fill="#F6C343"/>
  <text x="710" y="56" font-size="18" font-weight="700" fill="#0E1C1B" text-anchor="middle">Beispiel</text>

  <!-- Hilfslinien -->
  <g stroke="#55645F" stroke-width="1.5" stroke-dasharray="5 5">
    <path d="M458 96 V412"/>
    <path d="M530 96 V412"/>
  </g>

  <g font-size="18" text-anchor="end" fill="#0E1C1B">
    <text x="240" y="128" font-weight="600">Rohkarte</text>
    <text x="240" y="170" font-weight="600">Wert gegradet</text>
    <text x="240" y="212" fill="#55645F">− Grading</text>
    <text x="240" y="254" fill="#55645F">− Versand</text>
    <text x="240" y="296" fill="#55645F">− Versicherung</text>
    <text x="240" y="338" fill="#55645F">− Zeit &amp; Aufwand</text>
    <text x="240" y="380" font-weight="700">= Mehrwert</text>
  </g>
  <g>
    <rect x="260" y="104" width="198" height="34" rx="6" fill="#55645F" opacity="0.55"/>
    <rect x="260" y="146" width="396" height="34" rx="6" fill="#0B776B"/>
    <rect x="602" y="188" width="54" height="34" rx="6" fill="#E5484D"/>
    <rect x="575" y="230" width="27" height="34" rx="6" fill="#E5484D"/>
    <rect x="557" y="272" width="18" height="34" rx="6" fill="#E5484D"/>
    <rect x="530" y="314" width="27" height="34" rx="6" fill="#E5484D"/>
    <rect x="458" y="356" width="72" height="34" rx="6" fill="#2E9E5B"/>
  </g>
  <!-- Klammer Kosten -->
  <path d="M668 188 h8 v160 h-8" fill="none" stroke="#E5484D" stroke-width="2.5"/>
  <text x="690" y="274" font-size="18" font-weight="700" fill="#E5484D">Kosten</text>

  <text x="40" y="446" font-size="18" fill="#55645F">Faustregel: Nur wenn nach allen Kosten ein klarer Mehrwert bleibt.</text>
</svg>
