<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Ablauf beim Grading einer Sammelkarte in 5 Schritten</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B776B"/>
    </marker>
  </defs>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0E1C1B">So läuft Grading ab</text>

  <!-- Pfeile -->
  <g stroke="#0B776B" stroke-width="3" marker-end="url(#ar)">
    <path d="M150 180 H190"/><path d="M302 180 H342"/><path d="M454 180 H494"/><path d="M606 180 H646"/>
  </g>

  <!-- Kreise -->
  <g fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2">
    <circle cx="96" cy="180" r="48"/><circle cx="248" cy="180" r="48"/><circle cx="400" cy="180" r="48"/><circle cx="552" cy="180" r="48"/><circle cx="704" cy="180" r="48"/>
  </g>
  <!-- Nummern -->
  <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="130" cy="142" r="14" fill="#0B776B"/><text x="130" y="147">1</text>
    <circle cx="282" cy="142" r="14" fill="#0B776B"/><text x="282" y="147">2</text>
    <circle cx="434" cy="142" r="14" fill="#0B776B"/><text x="434" y="147">3</text>
    <circle cx="586" cy="142" r="14" fill="#0B776B"/><text x="586" y="147">4</text>
    <circle cx="738" cy="142" r="14" fill="#0B776B"/><text x="738" y="147">5</text>
  </g>

  <!-- 1 Karte in Hülle -->
  <g transform="translate(96 180)">
    <rect x="-20" y="-28" width="40" height="56" rx="4" fill="#0B776B"/>
    <rect x="-16" y="-24" width="32" height="48" rx="2" fill="#FFFFFF"/>
    <rect x="-12" y="-19" width="24" height="16" rx="2" fill="#D6EDE8"/>
    <rect x="-12" y="2" width="20" height="4" rx="2" fill="#D3DCD8"/>
    <rect x="-12" y="10" width="24" height="4" rx="2" fill="#D3DCD8"/>
    <rect x="-24" y="-32" width="48" height="64" rx="6" fill="none" stroke="#55645F" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <!-- 2 Paket -->
  <g transform="translate(248 180)">
    <path d="M-28 -12 L0 -24 L28 -12 L28 18 L0 30 L-28 18 Z" fill="#E7CC94" stroke="#B8955A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-28 -12 L0 0 L28 -12 M0 0 V30" stroke="#B8955A" stroke-width="2" fill="none"/>
    <path d="M-14 -18 L14 -6" stroke="#F6C343" stroke-width="5"/>
  </g>
  <!-- 3 Prüfung Lupe -->
  <g transform="translate(400 180)">
    <rect x="-24" y="-28" width="36" height="50" rx="4" fill="#0B776B"/>
    <rect x="-20" y="-24" width="28" height="42" rx="2" fill="#FFFFFF"/>
    <circle cx="6" cy="2" r="16" fill="#D6EDE8" fill-opacity="0.7" stroke="#0E1C1B" stroke-width="4"/>
    <path d="M17 13 L28 24" stroke="#0E1C1B" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- 4 Note -->
  <g transform="translate(552 180)">
    <circle r="26" fill="#F6C343"/>
    <path d="M-14 22 L-20 40 L-8 34 L-2 44 L2 26 Z M14 22 L20 40 L8 34 L2 44 L-2 26 Z" fill="#0B776B"/>
    <circle r="26" fill="#F6C343"/>
    <text y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1C1B">1–10</text>
  </g>
  <!-- 5 Slab -->
  <g transform="translate(704 180)">
    <rect x="-24" y="-34" width="48" height="68" rx="5" fill="#FFFFFF" stroke="#0E1C1B" stroke-width="3"/>
    <rect x="-19" y="-29" width="38" height="12" rx="2" fill="#0B776B"/>
    <rect x="-15" y="-25" width="18" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="-15" y="-12" width="30" height="41" rx="3" fill="#0B776B"/>
    <rect x="-12" y="-9" width="24" height="35" rx="2" fill="#FFFFFF"/>
    <rect x="-9" y="-6" width="18" height="12" rx="1" fill="#D6EDE8"/>
  </g>

  <!-- Beschriftung -->
  <g text-anchor="middle">
    <g font-size="19" font-weight="700" fill="#0E1C1B">
      <text x="96" y="270">Vorbereiten</text>
      <text x="248" y="270">Einschicken</text>
      <text x="400" y="270">Prüfung</text>
      <text x="552" y="270">Note 1–10</text>
      <text x="704" y="270">Slab zurück</text>
    </g>
    <g font-size="18" fill="#55645F">
      <text x="96" y="298">Karte in</text><text x="96" y="322">Schutzhülle</text>
      <text x="248" y="298">gut gepolstert</text><text x="248" y="322">versenden</text>
      <text x="552" y="298">je nach</text><text x="552" y="322">Zustand</text>
      <text x="704" y="298">versiegelte</text><text x="704" y="322">Hülle</text>
    </g>
  </g>
  <!-- Prüfkriterien -->
  <g font-size="18" fill="#0B776B" font-weight="600" text-anchor="middle">
    <rect x="345" y="284" width="110" height="28" rx="14" fill="#D6EDE8"/><text x="400" y="304">Ecken</text>
    <rect x="345" y="318" width="110" height="28" rx="14" fill="#D6EDE8"/><text x="400" y="338">Kanten</text>
    <rect x="335" y="352" width="130" height="28" rx="14" fill="#D6EDE8"/><text x="400" y="372">Oberfläche</text>
    <rect x="335" y="386" width="130" height="28" rx="14" fill="#D6EDE8"/><text x="400" y="406">Zentrierung</text>
  </g>
  <text x="40" y="452" font-size="18" fill="#55645F">Schematisch – Dauer und Kosten hängen vom Anbieter ab.</text>
</svg>
