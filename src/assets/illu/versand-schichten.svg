<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Verpackung einer Einzelkarte in 6 Schichten</title>
  <defs>
    <g id="card">
      <rect x="-30" y="-42" width="60" height="84" rx="5" fill="#0B776B"/>
      <rect x="-26" y="-38" width="52" height="76" rx="3" fill="#FFFFFF"/>
      <rect x="-21" y="-32" width="42" height="28" rx="2" fill="#D6EDE8"/>
      <circle cx="-9" cy="-20" r="6" fill="#F6C343"/>
      <path d="M-21 -4 L-6 -16 L4 -9 L12 -15 L21 -7 L21 -4 Z" fill="#0B776B"/>
      <rect x="-21" y="4" width="34" height="4" rx="2" fill="#D3DCD8"/>
      <rect x="-21" y="12" width="42" height="4" rx="2" fill="#D3DCD8"/>
      <rect x="-21" y="20" width="26" height="4" rx="2" fill="#D3DCD8"/>
    </g>
    <g id="sleeve"><rect x="-35" y="-48" width="70" height="94" rx="6" fill="#D6EDE8" fill-opacity="0.35" stroke="#0B776B" stroke-width="2"/></g>
    <g id="top"><rect x="-43" y="-58" width="86" height="112" rx="8" fill="#FFFFFF" fill-opacity="0.35" stroke="#55645F" stroke-width="5"/>
      <path d="M-12 -58 a12 8 0 0 0 24 0" fill="#F1F4F2" stroke="#55645F" stroke-width="3"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55645F"/></marker>
  </defs>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0E1C1B">So verpackst du eine Einzelkarte</text>

  <!-- 1 Karte -->
  <g transform="translate(75 220)"><use href="#card"/></g>
  <!-- 2 Sleeve -->
  <g transform="translate(205 220)"><use href="#card"/><use href="#sleeve"/></g>
  <!-- 3 Toploader -->
  <g transform="translate(335 220)"><use href="#card"/><use href="#sleeve"/><use href="#top"/></g>
  <!-- 4 Klebeband oben -->
  <g transform="translate(465 220)"><use href="#card"/><use href="#sleeve"/><use href="#top"/>
    <rect x="-50" y="-66" width="100" height="22" rx="3" fill="#F6C343" fill-opacity="0.8" stroke="#D9A21E" stroke-width="1.5"/>
  </g>
  <!-- 5 zwei Pappen -->
  <g transform="translate(595 220)">
    <rect x="-46" y="-70" width="104" height="138" rx="5" fill="#D9BC82" stroke="#B8955A" stroke-width="2"/>
    <g transform="scale(0.85)"><use href="#card"/><use href="#top"/></g>
    <rect x="-56" y="-60" width="104" height="138" rx="5" fill="#E7CC94" fill-opacity="0.82" stroke="#B8955A" stroke-width="2"/>
    <path d="M-56 -20 h104 M-56 30 h104" stroke="#B8955A" stroke-width="1.2" opacity="0.6"/>
  </g>
  <!-- 6 Umschlag -->
  <g transform="translate(725 220)">
    <rect x="-56" y="-72" width="112" height="150" rx="8" fill="#FBE7A6" stroke="#D9A21E" stroke-width="2"/>
    <path d="M-56 -50 L0 -16 L56 -50" fill="none" stroke="#D9A21E" stroke-width="2"/>
    <g fill="#FFFFFF" opacity="0.7">
      <circle cx="-36" cy="10" r="5"/><circle cx="-18" cy="10" r="5"/><circle cx="0" cy="10" r="5"/><circle cx="18" cy="10" r="5"/><circle cx="36" cy="10" r="5"/>
      <circle cx="-27" cy="28" r="5"/><circle cx="-9" cy="28" r="5"/><circle cx="9" cy="28" r="5"/><circle cx="27" cy="28" r="5"/>
      <circle cx="-36" cy="46" r="5"/><circle cx="-18" cy="46" r="5"/><circle cx="0" cy="46" r="5"/><circle cx="18" cy="46" r="5"/><circle cx="36" cy="46" r="5"/>
    </g>
  </g>

  <!-- Pfeile -->
  <g stroke="#55645F" stroke-width="2.5" marker-end="url(#ar)">
    <path d="M118 220 H156"/><path d="M252 220 H278"/><path d="M386 220 H408"/><path d="M520 220 H534"/><path d="M658 220 H664"/>
  </g>

  <!-- Nummern -->
  <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="75" cy="330" r="15" fill="#0B776B"/><text x="75" y="335">1</text>
    <circle cx="205" cy="330" r="15" fill="#0B776B"/><text x="205" y="335">2</text>
    <circle cx="335" cy="330" r="15" fill="#0B776B"/><text x="335" y="335">3</text>
    <circle cx="465" cy="330" r="15" fill="#0B776B"/><text x="465" y="335">4</text>
    <circle cx="595" cy="330" r="15" fill="#0B776B"/><text x="595" y="335">5</text>
    <circle cx="725" cy="330" r="15" fill="#0B776B"/><text x="725" y="335">6</text>
  </g>
  <g text-anchor="middle">
    <g font-size="19" font-weight="700" fill="#0E1C1B">
      <text x="75" y="374">Karte</text>
      <text x="205" y="374">Sleeve</text>
      <text x="335" y="374">Toploader</text>
      <text x="465" y="374">Klebeband</text>
      <text x="595" y="374">2 Pappen</text>
      <text x="725" y="374">Umschlag</text>
    </g>
    <g font-size="18" fill="#55645F">
      <text x="75" y="400">sauber</text>
      <text x="205" y="400">weiche Hülle</text>
      <text x="335" y="400">feste Hülle</text>
      <text x="465" y="400">oben zukleben</text>
      <text x="595" y="400">als Sandwich</text>
      <text x="725" y="400">Luftpolster</text>
    </g>
  </g>
  <text x="40" y="452" font-size="18" fill="#55645F">Die Karte darf im Toploader nicht verrutschen.</text>
</svg>
