<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Entscheidungsbaum: Versandart nach Kartenwert wählen</title>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>

  <!-- Wurzel -->
  <rect x="210" y="32" width="380" height="64" rx="16" fill="#0B776B"/>
  <text x="400" y="72" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wie viel ist die Karte wert?</text>

  <!-- Linien -->
  <g stroke="#55645F" stroke-width="2.5" fill="none">
    <path d="M400 96 V124 M150 124 H650 M150 124 V152 M400 124 V152 M650 124 V152"/>
    <path d="M150 188 V222 M400 188 V222 M650 188 V222"/>
  </g>

  <!-- Wertstufen -->
  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="80" y="152" width="140" height="36" rx="18" fill="#2E9E5B"/>
    <text x="150" y="177" fill="#FFFFFF">gering</text>
    <rect x="330" y="152" width="140" height="36" rx="18" fill="#F6C343"/>
    <text x="400" y="177" fill="#0E1C1B">mittel</text>
    <rect x="580" y="152" width="140" height="36" rx="18" fill="#E5484D"/>
    <text x="650" y="177" fill="#FFFFFF">hoch</text>
  </g>

  <!-- Blätter -->
  <g>
    <rect x="40" y="222" width="220" height="176" rx="18" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
    <rect x="290" y="222" width="220" height="176" rx="18" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
    <rect x="540" y="222" width="220" height="176" rx="18" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  </g>
  <!-- Icons -->
  <g transform="translate(150 256)">
    <rect x="-24" y="-16" width="48" height="32" rx="4" fill="#D6EDE8" stroke="#0B776B" stroke-width="2"/>
    <path d="M-24 -16 L0 4 L24 -16" fill="none" stroke="#0B776B" stroke-width="2"/>
  </g>
  <g transform="translate(400 254)">
    <rect x="-24" y="-16" width="48" height="32" rx="4" fill="#D6EDE8" stroke="#0B776B" stroke-width="2"/>
    <path d="M-24 -16 L0 4 L24 -16" fill="none" stroke="#0B776B" stroke-width="2"/>
    <circle cx="20" cy="12" r="11" fill="#F6C343"/>
    <path d="M14 12 l4 4 l7 -8" stroke="#0E1C1B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(650 256)">
    <path d="M-24 -10 L0 -20 L24 -10 L24 14 L0 24 L-24 14 Z" fill="#E7CC94" stroke="#B8955A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-24 -10 L0 0 L24 -10 M0 0 V24" stroke="#B8955A" stroke-width="2" fill="none"/>
    <path d="M22 -2 l10 -4 l10 4 v8 c0 8 -5 12 -10 14 c-5 -2 -10 -6 -10 -14 z" fill="#0B776B"/>
  </g>

  <g text-anchor="middle" fill="#0E1C1B">
    <g font-size="19" font-weight="700">
      <text x="150" y="314">Brief oder</text>
      <text x="150" y="338">Warensendung</text>
      <text x="400" y="302">Einschreiben oder</text>
      <text x="400" y="326">Brief mit</text>
      <text x="400" y="350">Nachverfolgung</text>
      <text x="650" y="314">Versichertes</text>
      <text x="650" y="338">Paket</text>
    </g>
    <g font-size="18" fill="#55645F">
      <text x="150" y="386">z. B. Bulk-Karten</text>
      <text x="400" y="386">mit Nachweis</text>
      <text x="650" y="386">Fotos + Beleg</text>
    </g>
  </g>
  <text x="40" y="448" font-size="18" fill="#55645F">Porto und Haftungsgrenzen immer beim Versanddienst prüfen.</text>
</svg>
