<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Checkliste: Echtheit einer Sammelkarte in 9 Schritten prüfen</title>
  <defs>
    <g id="ok">
      <rect x="-15" y="-15" width="30" height="30" rx="8" fill="#2E9E5B"/>
      <path d="M-7 0 l5 5 l9 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="row">
      <rect x="40" y="0" width="520" height="56" rx="14" fill="#FFFFFF" stroke="#D3DCD8"/>
      <circle cx="82" cy="28" r="20" fill="#D6EDE8"/>
    </g>
  </defs>
  <rect width="600" height="760" rx="24" fill="#F1F4F2"/>
  <text x="40" y="62" font-size="28" font-weight="700" fill="#0E1C1B">Echtheit in 9 Schritten</text>
  <text x="40" y="92" font-size="18" fill="#55645F">Je mehr Punkte passen, desto sicherer.</text>

  <g font-size="19" font-weight="600" fill="#0E1C1B">
    <!-- 1 Vergleichskarte -->
    <g transform="translate(0 114)">
      <use href="#row"/>
      <rect x="70" y="16" width="14" height="20" rx="2" fill="#FFFFFF" stroke="#0B776B" stroke-width="2"/>
      <rect x="80" y="20" width="14" height="20" rx="2" fill="#0B776B"/>
      <text x="118" y="35">Mit echter Vergleichskarte prüfen</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 2 Lichttest -->
    <g transform="translate(0 182)">
      <use href="#row"/>
      <path d="M76 17 h12 v6 l-3 4 v10 h-6 v-10 l-3 -4 z" fill="#0B776B"/>
      <path d="M72 14 l-4 -3 M82 12 v-4 M92 14 l4 -3" stroke="#F6C343" stroke-width="2.5" stroke-linecap="round"/>
      <text x="118" y="35">Lichttest mit Taschenlampe</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 3 Rückseite -->
    <g transform="translate(0 250)">
      <use href="#row"/>
      <rect x="73" y="15" width="18" height="26" rx="3" fill="#0B776B"/>
      <circle cx="82" cy="28" r="5" fill="#D6EDE8"/>
      <text x="118" y="35">Rückseite: Farbe und Druck</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 4 Schrift -->
    <g transform="translate(0 318)">
      <use href="#row"/>
      <text x="82" y="35" font-size="18" font-weight="800" fill="#0B776B" text-anchor="middle">Aa</text>
      <text x="118" y="35">Schrift: scharf, richtige Dicke</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 5 Holo -->
    <g transform="translate(0 386)">
      <use href="#row"/>
      <path d="M82 14 l3.5 10.5 l10.5 3.5 l-10.5 3.5 l-3.5 10.5 l-3.5 -10.5 l-10.5 -3.5 l10.5 -3.5 z" fill="#0B776B"/>
      <circle cx="93" cy="17" r="2.5" fill="#F6C343"/>
      <text x="118" y="35">Holo-Effekt: Muster und Glanz</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 6 Dicke -->
    <g transform="translate(0 454)">
      <use href="#row"/>
      <rect x="68" y="22" width="28" height="7" rx="2" fill="#0B776B"/>
      <path d="M68 36 h28 M68 33 v6 M96 33 v6" stroke="#0B776B" stroke-width="2" stroke-linecap="round"/>
      <path d="M68 16 h28 M68 13 v6 M96 13 v6" stroke="#0B776B" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <text x="118" y="35">Dicke und Kanten fühlen</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 7 Lupe -->
    <g transform="translate(0 522)">
      <use href="#row"/>
      <circle cx="79" cy="25" r="8" fill="#FFFFFF" stroke="#0B776B" stroke-width="3"/>
      <path d="M85 31 l7 7" stroke="#0B776B" stroke-width="4" stroke-linecap="round"/>
      <text x="118" y="35">Lupe: Druckraster ansehen</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 8 Verkäufer -->
    <g transform="translate(0 590)">
      <use href="#row"/>
      <circle cx="82" cy="21" r="6" fill="#0B776B"/>
      <path d="M71 39 a11 10 0 0 1 22 0 z" fill="#0B776B"/>
      <text x="118" y="35">Verkäufer und Bewertungen</text>
      <use href="#ok" x="526" y="28"/>
    </g>
    <!-- 9 Grading -->
    <g transform="translate(0 658)">
      <use href="#row"/>
      <rect x="72" y="13" width="20" height="30" rx="3" fill="#FFFFFF" stroke="#0B776B" stroke-width="2.5"/>
      <rect x="75" y="16" width="14" height="6" rx="1" fill="#0B776B"/>
      <rect x="76" y="26" width="12" height="13" rx="1" fill="#D6EDE8"/>
      <text x="118" y="35">Im Zweifel: Grading</text>
      <use href="#ok" x="526" y="28"/>
    </g>
  </g>
</svg>
