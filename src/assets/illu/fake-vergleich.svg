<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Original und Fälschung einer Sammelkarte im Vergleich</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E5484D"/>
    </marker>
    <pattern id="holoOk" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="none"/>
      <rect width="4" height="14" fill="#FFFFFF" opacity="0.45"/>
    </pattern>
    <pattern id="holoBad" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#FFFFFF" opacity="0.9"/>
    </pattern>
    <filter id="blur" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="0.9"/></filter>
  </defs>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0E1C1B">Original oder Fälschung?</text>

  <!-- Original -->
  <g transform="translate(90 100)">
    <rect width="170" height="238" rx="10" fill="#0B776B"/>
    <rect x="8" y="8" width="154" height="222" rx="6" fill="#FFFFFF"/>
    <text x="18" y="32" font-size="16" font-weight="600" fill="#0E1C1B">Name</text>
    <rect x="16" y="42" width="138" height="92" rx="4" fill="#D6EDE8"/>
    <circle cx="58" cy="80" r="20" fill="#F6C343"/>
    <path d="M16 134 L62 96 L92 120 L118 100 L154 130 L154 134 Z" fill="#0B776B"/>
    <rect x="16" y="42" width="138" height="92" rx="4" fill="url(#holoOk)"/>
    <rect x="16" y="148" width="120" height="8" rx="4" fill="#D3DCD8"/>
    <rect x="16" y="164" width="138" height="8" rx="4" fill="#D3DCD8"/>
    <rect x="16" y="180" width="92" height="8" rx="4" fill="#D3DCD8"/>
    <text x="18" y="218" font-size="12" fill="#55645F">Nr. 012/198</text>
  </g>
  <!-- Fälschung -->
  <g transform="translate(330 100)">
    <rect width="170" height="238" rx="10" fill="#0B776B"/>
    <rect x="4" y="5" width="152" height="221" rx="6" fill="#FFFFFF"/>
    <text x="16" y="32" font-size="19" font-weight="800" fill="#0E1C1B" filter="url(#blur)">Name</text>
    <rect x="14" y="42" width="136" height="92" rx="4" fill="#7FE0C6"/>
    <circle cx="56" cy="80" r="20" fill="#FF9F0A"/>
    <path d="M14 134 L60 96 L90 120 L116 100 L150 130 L150 134 Z" fill="#00A88E"/>
    <rect x="14" y="42" width="136" height="92" rx="4" fill="url(#holoBad)"/>
    <rect x="14" y="148" width="120" height="8" rx="4" fill="#D3DCD8"/>
    <rect x="14" y="164" width="136" height="8" rx="4" fill="#D3DCD8"/>
    <rect x="14" y="180" width="92" height="8" rx="4" fill="#D3DCD8"/>
    <text x="16" y="218" font-size="12" fill="#55645F">Nr. 012/198</text>
  </g>

  <!-- Pfeile -->
  <g stroke="#E5484D" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <path d="M556 152 L410 130"/>
    <path d="M556 210 L408 182"/>
    <path d="M556 268 L470 218"/>
    <path d="M556 326 L502 300"/>
  </g>
  <g font-size="18" fill="#0E1C1B" font-weight="600">
    <circle cx="574" cy="152" r="13" fill="#E5484D"/><text x="574" y="158" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">1</text>
    <text x="596" y="158">Schrift zu dick</text>
    <circle cx="574" cy="210" r="13" fill="#E5484D"/><text x="574" y="216" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">2</text>
    <text x="596" y="216">Farben zu kräftig</text>
    <circle cx="574" cy="268" r="13" fill="#E5484D"/><text x="574" y="274" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">3</text>
    <text x="596" y="274">Holo-Muster falsch</text>
    <circle cx="574" cy="326" r="13" fill="#E5484D"/><text x="574" y="332" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">4</text>
    <text x="596" y="332">Rand ungleich</text>
  </g>

  <!-- Bewertung -->
  <g>
    <circle cx="128" cy="374" r="15" fill="#2E9E5B"/>
    <path d="M121 374 l5 5 l9 -10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="381" font-size="20" font-weight="700" fill="#0E1C1B">Original</text>
    <circle cx="358" cy="374" r="15" fill="#E5484D"/>
    <path d="M352 368 l12 12 M364 368 l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="382" y="381" font-size="20" font-weight="700" fill="#0E1C1B">Fälschung</text>
  </g>
  <text x="40" y="440" font-size="18" fill="#55645F">Tipp: Immer mit einer sicher echten Karte aus demselben Set vergleichen.</text>
</svg>
