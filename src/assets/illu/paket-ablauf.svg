<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Flussdiagramm: Was tun, wenn ein Paket nicht angekommen ist?</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55645F"/></marker>
  </defs>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>

  <!-- Start -->
  <rect x="250" y="28" width="300" height="52" rx="26" fill="#0B776B"/>
  <text x="400" y="61" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paket nicht angekommen?</text>

  <g stroke="#55645F" stroke-width="2.5" fill="none">
    <path d="M400 80 V96 M210 96 H590 M210 96 V112 M590 96 V112" />
  </g>
  <!-- Weiche -->
  <rect x="60" y="112" width="300" height="78" rx="16" fill="#FFFFFF" stroke="#0B776B" stroke-width="2.5"/>
  <text x="210" y="144" font-size="20" font-weight="700" fill="#0B776B" text-anchor="middle">Händler</text>
  <text x="210" y="172" font-size="18" fill="#55645F" text-anchor="middle">Versandrisiko trägt der Händler</text>
  <rect x="440" y="112" width="300" height="78" rx="16" fill="#FFFFFF" stroke="#F6C343" stroke-width="2.5"/>
  <text x="590" y="144" font-size="20" font-weight="700" fill="#0E1C1B" text-anchor="middle">Privatverkauf</text>
  <text x="590" y="172" font-size="18" fill="#55645F" text-anchor="middle">Risiko oft beim Käufer</text>

  <g stroke="#55645F" stroke-width="2.5" fill="none">
    <path d="M210 190 V214 M590 190 V214 M210 214 H590 M400 214 V226"/>
  </g>
  <text x="400" y="248" font-size="18" font-weight="600" fill="#55645F" text-anchor="middle">Dann der Reihe nach:</text>

  <!-- Schritte -->
  <g fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2">
    <rect x="28" y="266" width="136" height="100" rx="14"/>
    <rect x="180" y="266" width="136" height="100" rx="14"/>
    <rect x="332" y="266" width="136" height="100" rx="14"/>
    <rect x="484" y="266" width="136" height="100" rx="14"/>
    <rect x="636" y="266" width="136" height="100" rx="14" stroke="#0B776B" stroke-dasharray="6 4"/>
  </g>
  <g stroke="#55645F" stroke-width="2.5" marker-end="url(#ar)">
    <path d="M164 316 H176"/><path d="M316 316 H328"/><path d="M468 316 H480"/><path d="M620 316 H632"/>
  </g>
  <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="96" cy="266" r="14" fill="#0B776B"/><text x="96" y="271">1</text>
    <circle cx="248" cy="266" r="14" fill="#0B776B"/><text x="248" y="271">2</text>
    <circle cx="400" cy="266" r="14" fill="#0B776B"/><text x="400" y="271">3</text>
    <circle cx="552" cy="266" r="14" fill="#0B776B"/><text x="552" y="271">4</text>
    <circle cx="704" cy="266" r="14" fill="#0B776B"/><text x="704" y="271">5</text>
  </g>
  <g font-size="18" font-weight="700" fill="#0E1C1B" text-anchor="middle">
    <text x="96" y="310">Sendungs-</text><text x="96" y="332">verfolgung</text><text x="96" y="354">prüfen</text>
    <text x="248" y="320">Nachbarn &amp;</text><text x="248" y="342">Abholstelle</text>
    <text x="400" y="310">Händler</text><text x="400" y="332">schriftlich</text><text x="400" y="354">kontaktieren</text>
    <text x="552" y="320">Zahlungsweg</text><text x="552" y="342">nutzen</text>
    <text x="704" y="320">Schlichtungs-</text><text x="704" y="342">stelle</text>
  </g>
  <g font-size="18" fill="#55645F" text-anchor="middle">
    <text x="96" y="394">Zustellort?</text>
    <text x="248" y="394">Paketshop?</text>
    <text x="400" y="394">Frist setzen</text>
    <text x="552" y="394">PayPal / Karte:</text>
    <text x="552" y="416">Rückbuchung</text>
    <text x="704" y="394">nur bei Händlern</text>
  </g>
  <text x="40" y="454" font-size="18" fill="#55645F">Alles schriftlich festhalten: Screenshots, Mails, Belege.</text>
</svg>
