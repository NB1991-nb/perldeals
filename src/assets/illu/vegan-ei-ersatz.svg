  <text x="305" y="190" font-size="18" fill="#0E1C1B">1 EL Sojamehl</text>
  <text x="305" y="218" font-size="18" fill="#55645F">+ 2 EL Sprudel</text>

  <rect x="540" y="84" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  <circle cx="580" cy="128" r="26" fill="#FFF3CC"/>
