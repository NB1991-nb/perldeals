  <text x="235" y="316" font-size="22" font-weight="800" fill="#0E1C1B">Apfelmus</text>
  <text x="177" y="370" font-size="18" fill="#0E1C1B">1 EL Apfelmus</text>
  <text x="177" y="398" font-size="18" fill="#55645F">+ 1 TL Öl</text>

  <rect x="412" y="264" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  <circle cx="452" cy="308" r="26" fill="#D6EDE8"/>
  <path d="M434 312 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0" stroke="#0B776B" stroke-width="3" fill="none"/>
