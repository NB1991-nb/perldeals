  <text x="618" y="136" font-size="22" font-weight="800" fill="#0E1C1B">Banane</text>
  <text x="560" y="190" font-size="18" fill="#0E1C1B">½ Banane</text>
  <text x="560" y="218" font-size="18" fill="#55645F">zerdrückt</text>

  <!-- Reihe 2 -->
  <rect x="157" y="264" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
