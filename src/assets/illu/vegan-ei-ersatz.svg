<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Ein Ei beim Backen ersetzen: fünf Varianten</title>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>
  <text x="40" y="56" font-size="26" font-weight="800" fill="#0E1C1B">1 Ei ersetzen: so geht’s</text>

  <!-- Reihe 1 -->
  <rect x="30" y="84" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  <circle cx="70" cy="128" r="26" fill="#C9A26B"/>
  <g fill="#8A6A3B"><ellipse cx="62" cy="122" rx="5" ry="3"/><ellipse cx="76" cy="130" rx="5" ry="3"/><ellipse cx="66" cy="138" rx="5" ry="3"/></g>
  <text x="108" y="136" font-size="22" font-weight="800" fill="#0E1C1B">Leinsamen</text>
  <text x="50" y="190" font-size="18" fill="#0E1C1B">2 EL gemahlen</text>
  <text x="50" y="218" font-size="18" fill="#55645F">+ 4 EL Wasser</text>

  <rect x="285" y="84" width="230" height="160" rx="16" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  <circle cx="325" cy="128" r="26" fill="#F6C343"/>
