<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Schuh-Kennzeichnung: drei Bereiche und vier Materialarten</title>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>
  <text x="40" y="56" font-size="26" font-weight="800" fill="#0E1C1B">Vegane Schuhe: das Etikett lesen</text>

  <!-- Schuh -->
  <path d="M70 330 L70 252 Q76 208 130 196 L196 186 Q226 146 272 146 L300 148 Q318 226 392 262 Q424 280 420 330 Z" fill="#0B776B"/>
  <path d="M196 186 Q236 174 282 178" fill="none" stroke="#F6C343" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#D6EDE8" stroke-width="4" stroke-linecap="round"><path d="M250 214 l26 -6 M262 238 l28 -6 M276 262 l28 -6"/></g>
  <rect x="74" y="316" width="342" height="12" rx="4" fill="#F6C343"/>
  <path d="M60 330 H428 Q436 330 436 340 V350 Q436 362 424 362 H70 Q58 362 58 350 V338 Q58 330 66 330 Z" fill="#55645F"/>
  <path d="M74 330 H416" stroke="#E5484D" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Beschriftungen -->
  <path d="M330 104 L292 200" stroke="#0E1C1B" stroke-width="2"/><circle cx="292" cy="200" r="5" fill="#0E1C1B"/>
  <text x="318" y="98" font-size="20" font-weight="700" fill="#0E1C1B">Obermaterial</text>

  <path d="M110 392 L150 322" stroke="#0E1C1B" stroke-width="2"/><circle cx="150" cy="322" r="5" fill="#0E1C1B"/>
  <text x="40" y="414" font-size="20" font-weight="700" fill="#0E1C1B">Futter &amp; Decksohle</text>

  <path d="M330 392 L320 356" stroke="#0E1C1B" stroke-width="2"/><circle cx="320" cy="356" r="5" fill="#0E1C1B"/>
  <text x="290" y="414" font-size="20" font-weight="700" fill="#0E1C1B">Laufsohle</text>

  <rect x="40" y="430" width="388" height="34" rx="10" fill="#FDECEC"/>
  <text x="56" y="453" font-size="18" font-weight="700" fill="#E5484D">Kleber steht nicht auf dem Etikett</text>

  <!-- Materialien -->
  <rect x="460" y="84" width="310" height="300" rx="16" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  <text x="480" y="118" font-size="20" font-weight="700" fill="#0E1C1B">Vegan in allen 3 Bereichen:</text>
  <g font-size="18" fill="#0E1C1B">
    <circle cx="494" cy="160" r="15" fill="#FDECEC"/><path d="M488 154 l12 12 M500 154 l-12 12" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
    <text x="520" y="166">Leder</text>
    <circle cx="494" cy="214" r="15" fill="#FDECEC"/><path d="M488 208 l12 12 M500 208 l-12 12" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
    <text x="520" y="220">beschichtetes Leder</text>
    <circle cx="494" cy="268" r="15" fill="#E3F4EA"/><path d="M487 268 l5 5 l9 -10" stroke="#2E9E5B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="274">Textil</text>
    <circle cx="494" cy="322" r="15" fill="#E3F4EA"/><path d="M487 322 l5 5 l9 -10" stroke="#2E9E5B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="318">Sonstiges</text>
    <text x="520" y="342" fill="#55645F">z. B. Kunststoff, Kork</text>
  </g>
  <rect x="460" y="400" width="310" height="64" rx="14" fill="#D6EDE8"/>
  <text x="615" y="427" font-size="18" font-weight="700" fill="#0B776B" text-anchor="middle">Sicher nur mit ausdrücklicher</text>
  <text x="615" y="451" font-size="18" font-weight="700" fill="#0B776B" text-anchor="middle">Kennzeichnung „vegan“</text>
</svg>
