<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Schematischer Fake-Shop mit sechs markierten Warnzeichen</title>
  <defs>
    <g id="n"><circle r="14" fill="#E5484D" stroke="#FFFFFF" stroke-width="2.5"/></g>
  </defs>
  <rect width="800" height="480" rx="24" fill="#F1F4F2"/>

  <!-- Browser -->
  <rect x="30" y="34" width="500" height="412" rx="14" fill="#FFFFFF" stroke="#D3DCD8" stroke-width="2"/>
  <path d="M30 48 a14 14 0 0 1 14 -14 h472 a14 14 0 0 1 14 14 v32 h-500 z" fill="#F1F4F2"/>
  <path d="M30 80 h500" stroke="#D3DCD8"/>
  <circle cx="52" cy="57" r="6" fill="#E5484D"/><circle cx="70" cy="57" r="6" fill="#F6C343"/><circle cx="88" cy="57" r="6" fill="#2E9E5B"/>
  <rect x="108" y="44" width="392" height="26" rx="13" fill="#FFFFFF" stroke="#D3DCD8"/>
  <text x="124" y="62" font-size="15" fill="#0E1C1B">http://beispiel-shop-de.example/sale</text>

  <!-- Countdown -->
  <rect x="30" y="81" width="500" height="36" fill="#FDECEC"/>
  <text x="50" y="105" font-size="16" font-weight="700" fill="#E5484D">Nur heute! Angebot endet in 00:09:59</text>

  <!-- Kopf -->
  <text x="50" y="156" font-size="22" font-weight="800" fill="#0E1C1B">Beispiel-Shop</text>
  <rect x="50" y="168" width="60" height="6" rx="3" fill="#D3DCD8"/><rect x="118" y="168" width="60" height="6" rx="3" fill="#D3DCD8"/><rect x="186" y="168" width="60" height="6" rx="3" fill="#D3DCD8"/>
  <!-- Siegel -->
  <g transform="translate(462 152)">
    <circle r="30" fill="#F6C343"/>
    <circle r="23" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text y="-3" font-size="10" font-weight="800" fill="#0E1C1B" text-anchor="middle">100 %</text>
    <text y="10" font-size="10" font-weight="800" fill="#0E1C1B" text-anchor="middle">GEPRÜFT</text>
  </g>

  <!-- Produkte -->
  <g>
    <rect x="50" y="196" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#D3DCD8"/>
    <rect x="62" y="208" width="72" height="96" rx="6" fill="#D6EDE8"/>
    <rect x="80" y="226" width="36" height="60" rx="4" fill="#0B776B"/>
    <rect x="146" y="212" width="66" height="26" rx="6" fill="#E5484D"/>
    <text x="179" y="231" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">−80 %</text>
    <text x="146" y="268" font-size="15" fill="#55645F" text-decoration="line-through">49,99 €</text>
    <text x="146" y="294" font-size="20" font-weight="800" fill="#E5484D">9,99 €</text>
    <rect x="62" y="316" width="196" height="20" rx="6" fill="#0B776B"/>
    <text x="160" y="331" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">In den Warenkorb</text>

    <rect x="290" y="196" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#D3DCD8"/>
    <rect x="302" y="208" width="72" height="96" rx="6" fill="#D6EDE8"/>
    <rect x="314" y="236" width="48" height="40" rx="4" fill="#0B776B"/>
    <rect x="386" y="212" width="66" height="26" rx="6" fill="#E5484D"/>
    <text x="419" y="231" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">−75 %</text>
    <text x="386" y="268" font-size="15" fill="#55645F" text-decoration="line-through">119,00 €</text>
    <text x="386" y="294" font-size="20" font-weight="800" fill="#E5484D">29,90 €</text>
    <rect x="302" y="316" width="196" height="20" rx="6" fill="#0B776B"/>
    <text x="400" y="331" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">In den Warenkorb</text>
  </g>

  <!-- Zahlung -->
  <rect x="50" y="360" width="460" height="34" rx="8" fill="#F1F4F2"/>
  <text x="64" y="383" font-size="16" fill="#0E1C1B">Zahlung: <tspan font-weight="700">nur Vorkasse per Überweisung</tspan></text>
  <!-- Footer -->
  <text x="50" y="428" font-size="15" fill="#55645F">Kontakt  ·  AGB  ·  </text>
  <text x="160" y="428" font-size="15" fill="#E5484D" text-decoration="line-through">Impressum</text>

  <!-- Nummern -->
  <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <use href="#n" x="506" y="57"/><text x="506" y="62">1</text>
    <use href="#n" x="270" y="214"/><text x="270" y="219">2</text>
    <use href="#n" x="510" y="377"/><text x="510" y="382">3</text>
    <use href="#n" x="254" y="423"/><text x="254" y="428">4</text>
    <use href="#n" x="494" y="126"/><text x="494" y="131">5</text>
    <use href="#n" x="400" y="99"/><text x="400" y="104">6</text>
  </g>

  <!-- Legende -->
  <text x="556" y="66" font-size="22" font-weight="700" fill="#0E1C1B">Warnzeichen</text>
  <g font-size="18" fill="#0E1C1B">
    <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="570" cy="110" r="14" fill="#E5484D"/><text x="570" y="115">1</text>
      <circle cx="570" cy="164" r="14" fill="#E5484D"/><text x="570" y="169">2</text>
      <circle cx="570" cy="218" r="14" fill="#E5484D"/><text x="570" y="223">3</text>
      <circle cx="570" cy="272" r="14" fill="#E5484D"/><text x="570" y="277">4</text>
      <circle cx="570" cy="326" r="14" fill="#E5484D"/><text x="570" y="331">5</text>
      <circle cx="570" cy="380" r="14" fill="#E5484D"/><text x="570" y="385">6</text>
    </g>
    <text x="594" y="116">Seltsame Adresse</text>
    <text x="594" y="170">Preise zu gut</text>
    <text x="594" y="224">Nur Vorkasse</text>
    <text x="594" y="278">Kein Impressum</text>
    <text x="594" y="332">Falsches Siegel</text>
    <text x="594" y="386">Countdown-Druck</text>
  </g>
