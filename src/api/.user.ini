; PHP2Shell (CVE-2026-109618/-109619): Angriffsfläche verkleinern, bis der Hoster gepatcht hat.
; Upload-Progress nutzen wir nicht.
session.upload_progress.enabled = 0
expose_php = Off
; Keine Fehlermeldungen im Browser (würden DB-Host/Benutzer zeigen)
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On
; Ankauf-Formular mit Fotos (04.11.)
file_uploads = On
upload_max_filesize = 8M
post_max_size = 30M
max_file_uploads = 6
